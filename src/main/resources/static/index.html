<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Projeto Bar</title>

  <style>
    body {
      font-family: Arial;
      margin: 40px;
      background: #f8f9fa;
    }

    h1 {
      margin-bottom: 20px;
    }

    .dropdown {
      margin-bottom: 15px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .menu-btn {
      background: #e9ecef;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      max-width: 400px;
    }

    input {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
    }

    #resultado {
      margin-top: 20px;
      white-space: pre-wrap;
      background: white;
      padding: 15px;
    }
  </style>
</head>

<body>

<h1>Projeto Bar</h1>

<button onclick="abrir('cliente')" class="menu-btn">Cliente ▼</button>
<button onclick="abrir('produto')" class="menu-btn">Produto ▼</button>

<div id="formulario" class="card"></div>
<div id="resultado"></div>

<script>

function abrir(tipo) {
  if (tipo === "cliente") {
    document.getElementById("formulario").innerHTML = `
      <h3>Cliente</h3>
      <button onclick="formCliente('add')">Adicionar</button>
      <button onclick="formCliente('edit')">Editar</button>
      <button onclick="formCliente('del')">Remover</button>
      <button onclick="listarClientes()">Listar</button>
    `;
  }

  if (tipo === "produto") {
    document.getElementById("formulario").innerHTML = `
      <h3>Produto</h3>
      <button onclick="formProduto('add')">Adicionar</button>
      <button onclick="formProduto('edit')">Editar</button>
      <button onclick="formProduto('del')">Remover</button>
      <button onclick="listarProdutos()">Listar</button>
    `;
  }
}

function formCliente(tipo) {
  if (tipo === "add") {
    formulario.innerHTML += `
      <input id="nome" placeholder="Nome">
      <input id="data" placeholder="DD/MM/AAAA">
      <button onclick="addCliente()">Enviar</button>
    `;
  }

  if (tipo === "edit") {
    formulario.innerHTML += `
      <input id="id" placeholder="ID">
      <input id="nome" placeholder="Nome">
      <input id="data" placeholder="DD/MM/AAAA">
      <button onclick="editCliente()">Enviar</button>
    `;
  }

  if (tipo === "del") {
    formulario.innerHTML += `
      <input id="id" placeholder="ID">
      <button onclick="delCliente()">Enviar</button>
    `;
  }
}

function formProduto(tipo) {
  if (tipo === "add") {
    formulario.innerHTML += `
      <input id="nome" placeholder="Nome">
      <input id="preco" placeholder="Preço">
      <input id="categoria" placeholder="ID Categoria">
      <button onclick="addProduto()">Enviar</button>
    `;
  }

  if (tipo === "edit") {
    formulario.innerHTML += `
      <input id="id" placeholder="ID">
      <input id="nome" placeholder="Nome">
      <input id="preco" placeholder="Preço">
      <input id="categoria" placeholder="ID Categoria">
      <button onclick="editProduto()">Enviar</button>
    `;
  }

  if (tipo === "del") {
    formulario.innerHTML += `
      <input id="id" placeholder="ID">
      <button onclick="delProduto()">Enviar</button>
    `;
  }
}

function converterData(d) {
  let p = d.split("/");
  return `${p[2]}-${p[1]}-${p[0]}`;
}

async function addCliente() {
  let res = await fetch("/cliente", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      nome: nome.value,
      data_nascimento: converterData(data.value)
    })
  });
  resultado.innerText = await res.text();
}

async function editCliente() {
  let res = await fetch("/cliente", {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      id_cliente: parseInt(id.value),
      nome: nome.value,
      data_nascimento: converterData(data.value)
    })
  });
  resultado.innerText = await res.text();
}

async function delCliente() {
  let res = await fetch(`/cliente/${id.value}`, {method:"DELETE"});
  resultado.innerText = await res.text();
}

async function listarClientes() {
  let res = await fetch("/cliente");
  resultado.innerText = JSON.stringify(await res.json(), null, 2);
}

async function addProduto() {
  let res = await fetch("/produto", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      nome: nome.value,
      preco: parseFloat(preco.value),
      id_categoria: parseInt(categoria.value)
    })
  });
  resultado.innerText = await res.text();
}

async function editProduto() {
  let res = await fetch("/produto", {
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      id_produto: parseInt(id.value),
      nome: nome.value,
      preco: parseFloat(preco.value),
      id_categoria: parseInt(categoria.value)
    })
  });
  resultado.innerText = await res.text();
}

async function delProduto() {
  let res = await fetch(`/produto/${id.value}`, {method:"DELETE"});
  resultado.innerText = await res.text();
}

async function listarProdutos() {
  let res = await fetch("/produto");
  resultado.innerText = JSON.stringify(await res.json(), null, 2);
}

</script>

</body>
</html>
